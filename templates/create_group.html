{% extends 'base.html' %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7">
      <h2>Create group</h2>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Group name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Initial members</label>
          <input type="text" name="members" class="form-control" placeholder="Aisha, Rohan, Priya, Meera">
          <small class="form-text text-muted">Comma-separated names. Creator is always included.</small>
        </div>
        <button class="btn btn-primary">Create group</button>
      </form>
    </div>
  </div>
{% endblock %}
