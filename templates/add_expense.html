{% extends 'base.html' %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h2>Add expense to {{ group.name }}</h2>
      <form method="post">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
          <div class="col-md-8"><label class="form-label">Description</label><input type="text" name="description" class="form-control" required></div>
        </div>
        <div class="row g-3 mt-3">
          <div class="col-md-4"><label class="form-label">Paid by</label><input type="text" name="paid_by" class="form-control" required></div>
          <div class="col-md-3"><label class="form-label">Amount</label><input type="number" step="0.01" name="amount" class="form-control" required></div>
          <div class="col-md-3"><label class="form-label">Currency</label><input type="text" name="currency" class="form-control" value="INR"></div>
          <div class="col-md-2"><label class="form-label">Split type</label><select name="split_type" class="form-select">
              {% for split in split_types %}
                <option value="{{ split }}">{{ split.title() }}</option>
              {% endfor %}
            </select></div>
        </div>
        <div class="mt-3">
          <label class="form-label">Split with</label>
          <input type="text" name="split_with" class="form-control" placeholder="Aisha; Rohan; Priya; Meera" required>
        </div>
        <div class="mt-3">
          <label class="form-label">Split details</label>
          <textarea name="split_details" class="form-control" rows="2" placeholder="Aisha 30%; Rohan 30%; Priya 30%; Meera 10%"></textarea>
        </div>
        <div class="mt-3">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
        <button class="btn btn-primary mt-3">Add expense</button>
      </form>
    </div>
  </div>
{% endblock %}
