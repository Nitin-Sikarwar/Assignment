services:
  - type: web
    name: shared-expenses-app
    env: python
    repo: https://github.com/Nitin-Sikarwar/Assignment
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: replace-me
